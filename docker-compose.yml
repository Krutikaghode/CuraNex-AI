services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: curanex
      POSTGRES_USER: curanex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curanex-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curanex -d curanex"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      CURANEX_DATABASE_URL: postgresql+psycopg://curanex:${POSTGRES_PASSWORD:-curanex-dev-only}@db:5432/curanex
      CURANEX_OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - appdata:/srv/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      CURANEX_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"

  # Local LLM for the RAG assistant (Phase 4). Opt in with: docker compose --profile llm up
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  appdata:
  ollama:
