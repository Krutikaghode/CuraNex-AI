services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: curanex
      POSTGRES_USER: curanex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curanex-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curanex -d curanex"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      CURANEX_DATABASE_URL: postgresql+psycopg://curanex:${POSTGRES_PASSWORD:-curanex-dev-only}@db:5432/curanex
      CURANEX_OLLAMA_BASE_URL: http://ollama:11434
      CURANEX_OLLAMA_MODEL: ${CURANEX_OLLAMA_MODEL:-llama3.1:8b}
      CURANEX_OLLAMA_EMBED_MODEL: ${CURANEX_OLLAMA_EMBED_MODEL:-nomic-embed-text}
      CURANEX_LLM_PROVIDER: ${CURANEX_LLM_PROVIDER:-ollama}
      # Demo defaults; override in .env. With CURANEX_ENVIRONMENT=production the API refuses
      # to start unless CURANEX_JWT_SECRET is a real secret.
      CURANEX_ENVIRONMENT: ${CURANEX_ENVIRONMENT:-development}
      CURANEX_JWT_SECRET: ${CURANEX_JWT_SECRET:-dev-only-insecure-secret-change-me-before-deploying}
      CURANEX_ADMIN_EMAIL: ${CURANEX_ADMIN_EMAIL:-admin@curanex.local}
      CURANEX_ADMIN_PASSWORD: ${CURANEX_ADMIN_PASSWORD:-Curanex-demo-123}
    volumes:
      - appdata:/srv/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      CURANEX_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"

  # Local LLM for the assistant. Opt in with: docker compose --profile llm up
  # Needs ~8 GB free RAM for llama3.1:8b; set CURANEX_OLLAMA_MODEL to a smaller model if not.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot job that downloads the chat and embedding models into the ollama volume.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["llm"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c"]
    command:
      - ollama pull ${CURANEX_OLLAMA_MODEL:-llama3.1:8b} && ollama pull ${CURANEX_OLLAMA_EMBED_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
  ollama:
