[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]  # Depends() in defaults is idiomatic; zip strictness not needed

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-local-folder = ["api_client", "ui"]
